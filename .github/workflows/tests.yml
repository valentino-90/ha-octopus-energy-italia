name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pure:
    name: Test puri (senza Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest aiohttp
      - run: python -m pytest -q -rs

  homeassistant:
    name: Test con Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q -rs
